server.port=8080
spring.application.name=student-performance

# ---- MySQL database ----
# The database "student_performance" is created automatically if the MySQL user is allowed to create it.
# Set your MySQL login here, or pass DB_USERNAME / DB_PASSWORD as environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/student_performance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Machine learning service (Python / Flask) ----
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}
ml.service.timeout-ms=4000

# Origin of the React dev server (used for CORS)
app.cors.allowed-origin=http://localhost:5173

server.port=${PORT:8080}
spring.application.name=student-performance

# ---- MySQL database ----
# Allows specifying full JDBC URL via DB_URL (for TiDB, Aiven, Railway, etc.) or defaulting to localhost
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:student_performance}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Machine learning service (Python / Flask) ----
ml.service.url=${ML_SERVICE_URL:http://localhost:5001}
ml.service.timeout-ms=${ML_SERVICE_TIMEOUT_MS:30000}

# Origin of the React dev server or production URL (used for CORS)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}

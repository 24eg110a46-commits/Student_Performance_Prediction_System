version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: spps-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_performance
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: spps-ml-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spps-backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://database:3306/student_performance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      ML_SERVICE_URL: http://ml-service:5001
      CORS_ALLOWED_ORIGIN: "*"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spps-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
